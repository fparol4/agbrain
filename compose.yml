services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agbrain
      POSTGRES_USER: agbrain
      POSTGRES_PASSWORD: agbrain
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - agbrain_nest_postgres:/var/lib/postgresql/data
      - ./server/docker/postgres/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agbrain -d agbrain"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      CLIENT_URL: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: agbrain
      DB_PASSWORD: agbrain
      DB_DATABASE: agbrain
      SESSION_COOKIE: agbrain-session
      SESSION_SECURE_COOKIE: "false"
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: admin@agbrain.local
      ADMIN_PASSWORD: change-me
    ports:
      - "127.0.0.1:${API_PORT:-3334}:3333"
    command: ["sh", "-c", "npm run db:seed:prod && npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  client:
    build: ./client
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:

  agbrain_nest_postgres:
