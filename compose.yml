name: agbrain

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-agbrain}
      POSTGRES_USER: ${DB_USER:-agbrain}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/docker/postgres/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-agbrain} -d ${DB_DATABASE:-agbrain}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  api:
    build:
      context: ./server
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      CLIENT_URL: ${APP_URL:?Set APP_URL in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-agbrain}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-agbrain}
      SESSION_COOKIE: ${SESSION_COOKIE:-agbrain-session}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-3334}:3333"
    command: ["sh", "-c", "npm run db:seed:prod && exec npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 20s
    logging: *default-logging

  client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:2019/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
    name: agbrain_agbrain_nest_postgres
  caddy_data:
  caddy_config:
